# ============================================================
# AI-krasota: маршрутизация по субдоменам (PRD §3.1)
#   anna.ai-krasota.ru  -> сайт салона (tenant slug = anna)
#   www.ai-krasota.ru / ai-krasota.ru -> лендинг + кабинет
#   api.ai-krasota.ru   -> FastAPI
# В локальной разработке используйте *.localhost (resolve через dnsmasq
# или строки в /etc/hosts).
# ============================================================

upstream web {
    server web:3000;
}

upstream api {
    server api:8000;
}

# --- API ---
server {
    listen 80;
    server_name api.localhost api.ai-krasota.ru;

    location / {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- Сайты салонов: <slug>.ai-krasota.ru ---
server {
    listen 80;
    server_name ~^(?<tenant_slug>[a-z0-9-]+)\.ai-krasota\.ru$;

    set $tenant $tenant_slug;

    location / {
        proxy_pass http://web;
        proxy_set_header Host $host;
        proxy_set_header X-Tenant-Slug $tenant_slug;      # frontend/backend читают тенант из заголовка
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;  # WebSocket (AI-чат, hot-reload)
    }
}

# --- Лендинг платформы и личный кабинет ---
server {
    listen 80 default_server;
    server_name localhost ai-krasota.ru www.ai-krasota.ru;

    location /api/ {
        proxy_pass http://api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
