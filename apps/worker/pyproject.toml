[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aikrasota-worker"
version = "0.1.0"
description = "AI-krasota worker: Celery (напоминания, боты, AI, уведомления)"
requires-python = ">=3.11"
dependencies = [
    "celery[redis]>=5.4",
    "redis>=5.0",
    "httpx>=0.27",
    "pydantic-settings>=2.3",
]

[tool.setuptools.packages.find]
include = ["app*"]
