name: CI / backend

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - '.github/workflows/backend.yml'
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/**'

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_krasota_test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_krasota_test
      REDIS_URL: redis://localhost:6379
      API_SECRET_KEY: test-secret-key-for-ci
      DEBUG: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('apps/api/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "requirements.txt not found, skipping"
            exit 1
          fi

      - name: Run Alembic migrations
        run: alembic upgrade head || echo "alembic not configured yet"

      - name: Lint
        run: |
          pip install ruff
          ruff check . || echo "ruff issues found (non-blocking for now)"

      - name: Run tests
        run: |
          pip install pytest pytest-cov
          if [ -d tests ]; then
            pytest tests/ -v --tb=short
          else
            echo "tests directory not found, skipping"
          fi
